spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

# 로컬 개발 전용 기본값입니다. 운영 프로필은 반드시 JWT_SECRET 환경변수를 사용합니다.
jwt:
  secret: ${JWT_SECRET:todayeng-local-development-jwt-secret-key-change-me-2026}

oauth:
  google-calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/external-accounts/google-calendar/callback}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/external-accounts/spotify/callback}

security:
  oauth:
    authorization-endpoint-permit-all: true

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

google:
  client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    org.hibernate.SQL: debug
