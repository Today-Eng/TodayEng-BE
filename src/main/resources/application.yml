spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

google:
  client-id: ${GOOGLE_CLIENT_ID}
  tts:
    language-code: en-US
    voice-name: en-US-Neural2-F
    speaking-rate: 0.95
    audio-encoding: MP3
    credentials-location: ${GOOGLE_TTS_CREDENTIALS:classpath:google-credentials.json}
  speech:
    language-code: en-US
    audio-encoding: WEBM_OPUS
    content-type: audio/webm
    file-extension: webm
    credentials-location: ${GOOGLE_SPEECH_CREDENTIALS:classpath:google-credentials.json}
    max-file-size-bytes: 10485760

oauth:
  google-calendar:
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
    scopes:
      - openid
      - email
      - https://www.googleapis.com/auth/calendar.events.readonly
  spotify:
    authorization-uri: https://accounts.spotify.com/authorize
    token-uri: https://accounts.spotify.com/api/token
    user-info-uri: https://api.spotify.com/v1/me
    scopes:
      - user-read-email
      - user-read-recently-played

web-push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: ${VAPID_SUBJECT}

notification:
  diary-reminder:
    cron: ${DIARY_REMINDER_CRON:0 0 22 * * *}
    zone: ${DIARY_REMINDER_ZONE:Asia/Seoul}

diary:
  sse:
    timeout-millis: 1800000
    heartbeat-interval-millis: 30000

gemini:
  base-url: https://generativelanguage.googleapis.com
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash
  connect-timeout-seconds: 3
  read-timeout-seconds: 30

storage:
  audio:
    type: ${AUDIO_STORAGE_TYPE:local}
    # Local development storage only. A shared object store is required before
    # running multiple instances or replacing an instance during deployment.
    directory: ${AUDIO_STORAGE_DIRECTORY:./storage/audio}
    public-url-prefix: ${AUDIO_PUBLIC_URL_PREFIX:/files/audio}
    s3:
      bucket: ${AUDIO_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      tts-prefix: ${AUDIO_S3_TTS_PREFIX:tts}
      stt-prefix: ${AUDIO_S3_STT_PREFIX:stt}
      playback-url-expiration: ${AUDIO_PLAYBACK_URL_EXPIRATION:30m}
