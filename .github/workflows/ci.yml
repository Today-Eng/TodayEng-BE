name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Verify MySQL migration test ran
        run: |
          results=(
            "build/test-results/test/TEST-com.example.todayEng.global.config.FlywayMigrationIntegrationTest.xml"
            "build/test-results/test/TEST-com.example.todayEng.global.config.FlywayExistingSchemaBootIntegrationTest.xml"
          )

          for result in "${results[@]}"; do
            test -f "$result"
          done

          python3 - "${results[@]}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          for result_path in sys.argv[1:]:
              suite = ET.parse(result_path).getroot()
              counts = {
                  name: int(suite.attrib.get(name, "-1"))
                  for name in ("tests", "skipped", "failures", "errors")
              }

              if counts["tests"] < 1 or any(
                  counts[name] != 0 for name in ("skipped", "failures", "errors")
              ):
                  raise SystemExit(
                      f"MySQL migration test did not run successfully: "
                      f"{result_path}: {counts}"
                  )
          PY
