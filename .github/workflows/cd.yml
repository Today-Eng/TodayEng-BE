name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Blue-Green Deploy
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      GCP_PROJECT_ID: todayeng-503801
      URL_MAP: todayeng-lb
      BLUE_BACKEND: todayeng-blue-backend
      GREEN_BACKEND: todayeng-green-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build executable JAR
        run: ./gradlew clean bootJar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todayeng-be:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Detect active and standby environment
        id: target
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_BACKEND_URL=$(gcloud compute url-maps describe "${URL_MAP}" \
            --global \
            --format="value(defaultService)")

          CURRENT_BACKEND="${CURRENT_BACKEND_URL##*/}"

          echo "Current active backend: ${CURRENT_BACKEND}"

          if [ "${CURRENT_BACKEND}" = "${BLUE_BACKEND}" ]; then
            ACTIVE_COLOR="blue"
            STANDBY_COLOR="green"
            STANDBY_BACKEND="${GREEN_BACKEND}"

          elif [ "${CURRENT_BACKEND}" = "${GREEN_BACKEND}" ]; then
            ACTIVE_COLOR="green"
            STANDBY_COLOR="blue"
            STANDBY_BACKEND="${BLUE_BACKEND}"

          else
            echo "Unknown current backend: ${CURRENT_BACKEND}"
            exit 1
          fi

          echo "Active environment: ${ACTIVE_COLOR}"
          echo "Standby environment: ${STANDBY_COLOR}"
          echo "Standby backend: ${STANDBY_BACKEND}"

          echo "active_color=${ACTIVE_COLOR}" >> "$GITHUB_OUTPUT"
          echo "standby_color=${STANDBY_COLOR}" >> "$GITHUB_OUTPUT"
          echo "standby_backend=${STANDBY_BACKEND}" >> "$GITHUB_OUTPUT"

      - name: Deploy SHA image to Green standby
        if: steps.target.outputs.standby_color == 'green'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GREEN_VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd /opt/todayeng

            echo "Deploying image: ${{ env.IMAGE_TAG }}"
            echo "Target environment: Green"

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d

            echo "Waiting for Green application startup..."

            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null \
                http://127.0.0.1:8080/health; then

                echo "Green application health check passed."

                IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
                  --env-file .env \
                  -f docker-compose.prod.yml \
                  ps

                exit 0
              fi

              echo "Health check attempt ${attempt}/30 failed."
              sleep 5
            done

            echo "Green application health check failed."

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              ps

            docker logs --tail 200 todayeng-app

            exit 1

      - name: Deploy SHA image to Blue standby
        if: steps.target.outputs.standby_color == 'blue'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BLUE_VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd /opt/todayeng

            echo "Deploying image: ${{ env.IMAGE_TAG }}"
            echo "Target environment: Blue"

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d

            echo "Waiting for Blue application startup..."

            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null \
                http://127.0.0.1:8080/health; then

                echo "Blue application health check passed."

                IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
                  --env-file .env \
                  -f docker-compose.prod.yml \
                  ps

                exit 0
              fi

              echo "Health check attempt ${attempt}/30 failed."
              sleep 5
            done

            echo "Blue application health check failed."

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              ps

            docker logs --tail 200 todayeng-app

            exit 1

      - name: Wait for GCP standby backend health
        shell: bash
        run: |
          set -euo pipefail

          BACKEND="${{ steps.target.outputs.standby_backend }}"

          echo "Waiting for GCP backend health: ${BACKEND}"

          for attempt in $(seq 1 30); do
            HEALTH=$(gcloud compute backend-services get-health "${BACKEND}" \
              --global \
              --format="value(status.healthStatus.healthState)" \
              | head -n 1)

            echo "Backend health: ${HEALTH:-UNKNOWN}"

            if [ "${HEALTH}" = "HEALTHY" ]; then
              echo "Standby backend is healthy."
              exit 0
            fi

            echo "GCP backend health check attempt ${attempt}/30 failed."
            sleep 10
          done

          echo "Standby backend did not become healthy."
          exit 1

      - name: Switch traffic to standby
        id: switch
        shell: bash
        run: |
          set -euo pipefail

          BACKEND="${{ steps.target.outputs.standby_backend }}"

          echo "Switching URL Map from ${{ steps.target.outputs.active_color }} to ${{ steps.target.outputs.standby_color }}"
          echo "New backend: ${BACKEND}"

          gcloud compute url-maps set-default-service "${URL_MAP}" \
            --default-service="${BACKEND}" \
            --global

      - name: Verify URL Map update
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="${{ steps.target.outputs.standby_backend }}"

          for attempt in $(seq 1 30); do
            CURRENT_URL=$(gcloud compute url-maps describe "${URL_MAP}" \
              --global \
              --format="value(defaultService)")

            CURRENT="${CURRENT_URL##*/}"

            echo "Current URL Map backend: ${CURRENT}"

            if [ "${CURRENT}" = "${EXPECTED}" ]; then
              echo "URL Map update completed."
              exit 0
            fi

            echo "URL Map update attempt ${attempt}/30 not reflected yet."
            sleep 5
          done

          echo "URL Map update verification failed."
          exit 1

      - name: Rollback traffic to previous active
        id: rollback
        if: failure() && steps.switch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_COLOR="${{ steps.target.outputs.active_color }}"

          if [ "${ACTIVE_COLOR}" = "blue" ]; then
            PREVIOUS_BACKEND="${BLUE_BACKEND}"
          elif [ "${ACTIVE_COLOR}" = "green" ]; then
            PREVIOUS_BACKEND="${GREEN_BACKEND}"
          else
            echo "Cannot determine previous backend from active color: ${ACTIVE_COLOR}"
            exit 1
          fi

          echo "======================================"
          echo "URL Map update verification failed."
          echo "Starting automatic rollback."
          echo "Previous active : ${ACTIVE_COLOR}"
          echo "Rollback backend: ${PREVIOUS_BACKEND}"
          echo "======================================"

          if ! gcloud compute url-maps set-default-service "${URL_MAP}" \
            --default-service="${PREVIOUS_BACKEND}" \
            --global; then
            echo "Failed to rollback URL Map to ${PREVIOUS_BACKEND}."

            CURRENT="UNKNOWN"

            if CURRENT_URL=$(gcloud compute url-maps describe "${URL_MAP}" \
              --global \
              --format="value(defaultService)"); then
              CURRENT="${CURRENT_URL##*/}"
            else
              echo "Failed to query URL Map after rollback command failure."
            fi

            echo "Current backend: ${CURRENT}"
            exit 1
          fi

          echo "Rollback command completed."

      - name: Verify URL Map rollback
        if: failure() && steps.switch.outcome == 'success' && steps.rollback.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_COLOR="${{ steps.target.outputs.active_color }}"

          if [ "${ACTIVE_COLOR}" = "blue" ]; then
            EXPECTED="${BLUE_BACKEND}"
          elif [ "${ACTIVE_COLOR}" = "green" ]; then
            EXPECTED="${GREEN_BACKEND}"
          else
            echo "Cannot determine rollback backend from active color: ${ACTIVE_COLOR}"
            exit 1
          fi

          echo "Verifying rollback to: ${EXPECTED}"
          CURRENT="UNKNOWN"

          for attempt in $(seq 1 30); do
            if ! CURRENT_URL=$(gcloud compute url-maps describe "${URL_MAP}" \
              --global \
              --format="value(defaultService)"); then
              echo "Failed to query URL Map during rollback verification."
              echo "Rollback verification attempt ${attempt}/30 failed."
              sleep 5
              continue
            fi

            CURRENT="${CURRENT_URL##*/}"

            echo "Current URL Map backend: ${CURRENT}"

            if [ "${CURRENT}" = "${EXPECTED}" ]; then
              echo "URL Map rollback completed successfully."
              exit 0
            fi

            echo "Rollback verification attempt ${attempt}/30 not reflected yet."
            sleep 5
          done

          echo "URL Map rollback verification failed."
          echo "Expected backend: ${EXPECTED}"
          echo "Current backend : ${CURRENT}"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "======================================"
          echo "Blue-Green deployment completed"
          echo "======================================"
          echo "Previous active : ${{ steps.target.outputs.active_color }}"
          echo "New active      : ${{ steps.target.outputs.standby_color }}"
          echo "Backend         : ${{ steps.target.outputs.standby_backend }}"
          echo "Image tag       : ${{ env.IMAGE_TAG }}"
