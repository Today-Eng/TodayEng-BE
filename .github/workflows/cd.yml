name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build executable JAR
        run: ./gradlew clean bootJar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todayeng-be:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd /opt/todayeng

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d

            echo "Waiting for application startup..."

            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null \
                http://127.0.0.1:8080/health; then

                echo "Application health check passed."

                IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
                  --env-file .env \
                  -f docker-compose.prod.yml \
                  ps

                docker image prune -f
                exit 0
              fi

              echo "Health check attempt ${attempt}/30 failed."
              sleep 5
            done

            echo "Application health check failed."

            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              ps

            docker logs --tail 200 todayeng-app

            exit 1
